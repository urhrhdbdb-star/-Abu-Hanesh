<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abu Hansh</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.08),transparent 55%),#000}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
h1{font-size:clamp(50px,15vw,112px);margin:0 0 24px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#fff,#7a7a7a,#fff,#7a7a7a,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite;filter:drop-shadow(0 0 16px rgba(255,255,255,.45))}
@keyframes sh{to{background-position:300% 0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
p.desc{max-width:560px;margin:0 0 38px;color:#b4b4c4;font-size:clamp(17px,4.8vw,26px);line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:min(310px,82vw);margin:0 auto 20px;padding:21px 0;color:#fff;font-size:24px;cursor:pointer;border-radius:22px;border:1px solid rgba(255,255,255,.2);background:#000;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 18px rgba(255,255,255,.28);transition:transform .2s,box-shadow .2s}
.btn:active,.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 0 30px rgba(255,255,255,.6)}
.page{display:none}
.page.on{display:flex;flex-direction:column;align-items:center;animation:up .45s ease}
h2{font-size:40px;margin:0 0 16px;text-shadow:0 0 14px rgba(255,255,255,.6)}
.empty{color:#888;margin-bottom:36px;font-size:20px}
.card{position:relative;width:min(560px,94vw);margin:0 auto 28px;padding:28px 16px;border-radius:28px;background:#0a0a0a;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 36px rgba(255,255,255,.1)}
.card h2{font-size:clamp(26px,8vw,40px)}
.gen{background:#000;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:18px 36px;font-size:20px;font-weight:700;cursor:pointer;margin:8px 0 14px;box-shadow:0 0 22px rgba(255,255,255,.35)}
.gen:active{transform:scale(.97)}
.gen:disabled{opacity:.55;box-shadow:none;cursor:default}
.note{color:#8d8da3;font-size:14px;margin:0 0 20px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:17px;padding:10px 6px;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
td{padding:13px 6px;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06)}
td.k{font-family:monospace;word-break:break-all;color:#fff}
td.t{color:#d4d4d4;font-variant-numeric:tabular-nums}
.cp{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 13px;cursor:pointer}
.back{position:absolute;top:14px;left:14px;background:none;border:0;color:#fff;font-size:38px;line-height:1;padding:6px 12px;cursor:pointer;text-shadow:0 0 12px rgba(255,255,255,.7)}
body.full main{justify-content:flex-start;padding:0}
body.full .page.on{width:100%}
body.full .card{width:100%;min-height:100vh;margin:0;border:0;border-radius:0;padding-top:80px}
body.full #scripts{padding:32px 20px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <section id="home" class="page on">
    <h1>Abu Hansh</h1>
    <p class="desc">Website For Publishing Roblox Scripts Specifically For “PvP” Maps All Scripts Are Created By Abu Hansh</p>
    <button class="btn" onclick="show('keys')">🔑 Keys</button>
    <button class="btn" onclick="show('scripts')">📜 Scripts</button>
  </section>
  <section id="keys" class="page">
    <div class="card">
      <button class="back" onclick="show('home')" aria-label="Back">←</button>
      <h2>🔐 Key Generator</h2>
      <button class="gen" id="genBtn" onclick="genKey()">Generate Key</button>
      <p class="note">Your keys stay saved here until they expire (48h).</p>
      <div class="tbl"><table>
        <thead><tr><th>#</th><th>Key</th><th>Expires In</th><th>Copy</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </section>
  <section id="scripts" class="page">
    <h2>Scripts</h2>
    <p class="empty">Coming soon…</p>
    <button class="btn" onclick="show('home')">Back</button>
  </section>
</main>
<script>
function show(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on')});document.getElementById(id).classList.add('on');document.body.classList.toggle('full',id!=='home');window.scrollTo(0,0)}
var LIFE=48*3600*1000,WAIT=30000,keys=[],ready=0;
function ld(){try{keys=JSON.parse(localStorage.getItem('ah_keys')||'[]');ready=+localStorage.getItem('ah_ready')||0}catch(e){keys=[];ready=0}}
function sv(){try{localStorage.setItem('ah_keys',JSON.stringify(keys));localStorage.setItem('ah_ready',String(ready))}catch(e){}}
function part(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='',a=new Uint32Array(5);crypto.getRandomValues(a);for(var i=0;i<5;i++)s+=c[a[i]%c.length];return s}
function genKey(){if(ready>Date.now())return;ready=Date.now()+WAIT;sv();tick()}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(function(n){return String(n).padStart(2,'0')}).join(':')}
var lt=0;function tick(){var now=Date.now();lt=now;
if(ready&&now>=ready){keys.unshift({key:'AH-'+part()+'-'+part(),end:now+LIFE});ready=0;sv()}
var n=keys.length;keys=keys.filter(function(k){return k.end>now});if(keys.length!==n)sv();
var b=document.getElementById('genBtn');
if(ready>now){b.disabled=true;b.textContent='Please wait '+Math.ceil((ready-now)/1000)+'s'}else{b.disabled=false;b.textContent='Generate Key'}
document.getElementById('rows').innerHTML=keys.map(function(k,i){return '<tr><td>'+(i+1)+'</td><td class="k">'+k.key+'</td><td class="t">'+fmt(k.end-now)+'</td><td><button class="cp" onclick="copyKey('+i+',this)">Copy</button></td></tr>'}).join('')}
function copyKey(i,btn){function ok(){btn.textContent='Done';setTimeout(function(){btn.textContent='Copy'},1200)}try{navigator.clipboard.writeText(keys[i].key).then(ok)}catch(e){}}
ld();tick();setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
addEventListener('pageshow',tick);addEventListener('focus',tick);
var cv=document.getElementById('bg'),g=cv.getContext('2d'),W,H,ps=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',rs);rs();
for(var i=0;i<55;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,v:Math.random()*.4+.1,a:Math.random()*.5+.2});
(function f(){if(Date.now()-lt>900)tick();g.clearRect(0,0,W,H);ps.forEach(function(p){p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}g.fillStyle='rgba(255,255,255,'+p.a+')';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});requestAnimationFrame(f)})();
</script>
</body>
</html>
